  <rect width="64" height="64" rx="15" fill="#161618"></rect>
  <circle cx="32" cy="29" r="30" fill="url(#glow)"></circle>

  <rect x="15" y="16" width="34" height="32" rx="6" fill="url(#ticket)" stroke="#D0AD73" stroke-width="2"></rect>

  <path d="M21 18v28M43 18v28" stroke="#D0AD73" stroke-width="1.5" stroke-dasharray="3 3" opacity=".85"></path>

  <text x="32" y="39" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="25" font-weight="500" fill="#D0AD73" opacity=".65" filter="url(#gold-glow)">M</text>

  <text x="32" y="39" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="25" font-weight="500" fill="#FFF5DB" opacity=".35" filter="url(#white-glow)">M</text>

  <text x="32" y="39" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="25" font-weight="500" fill="url(#gold)">M</text>
