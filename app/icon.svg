<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="43%" r="60%">
      <stop offset="0" stop-color="#B73548" stop-opacity=".28"></stop>
      <stop offset="1" stop-color="#161618" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="ticket" x1="17" y1="17" x2="48" y2="47" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B73548"></stop>
      <stop offset="1" stop-color="#7E1F30"></stop>
    </linearGradient>
    <linearGradient id="gold" x1="20" y1="23" x2="44" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3DEAE"></stop>
      <stop offset=".5" stop-color="#D0AD73"></stop>
      <stop offset="1" stop-color="#B99A63"></stop>
    </linearGradient>
    <filter id="gold-glow" x="-60%" y="-60%" width="220%" height="220%">
