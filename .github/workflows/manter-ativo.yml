# O Supabase gratuito pausa o projeto depois de uma semana com pouca atividade, e a demo
# para de funcionar. "Algumas requisições ao banco por dia" bastam (documentação do Supabase):
# este job chama /api/health, que faz uma consulta real ao banco, 4 vezes por dia.
# De bônus, serve de monitor: se o app ou o banco caírem, o job falha e o GitHub avisa por e-mail.
# Atenção: em repositório público, o GitHub desliga jobs agendados após 60 dias sem atividade
# no repositório (documentação do GitHub) — para voltar, basta reativar em Actions.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta o banco pela rota de saúde do app
        run: curl --fail --silent --show-error --max-time 30 https://matchflix-dusky.vercel.app/api/health
