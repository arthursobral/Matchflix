name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build de produção
        run: npm run build

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes end-to-end
        run: npm test
        env:
          CI: true

      - name: Relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
